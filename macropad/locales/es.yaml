about_title: Acerca de CH57x Deck
about_text: '<h3>CH57x Deck</h3><p>Versión {version}</p><p>Creado por <b>Péricles Sávio</b>.</p><p>Frontend
  gráfico para <a href=''https://github.com/kriomant/ch57x-keyboard-tool'' style=''color:{link_color}''>ch57x-keyboard-tool</a>:
  arma la configuración del macropad en una interfaz visual y delega en ese binario toda la comunicación
  USB (validación y grabación en el firmware del dispositivo).</p><p>Licencia: <b>GPL-3.0-or-later</b>.</p>'
