adv_placeholder: 'ej.: ctrl-alt-t  |  click(left)  |  <110>'
adv_hint: 'Expresión libre en el dialecto del firmware.

  Ratón: click(left), wheel(-1), move(5,0), drag(left,0,5)

  Código bruto: <110>   Macro: ctrl-c,ctrl-v


  El macropad solo envía teclas — no ejecuta comandos.

  Para abrir un programa, asigne aquí una tecla F13–F24 y cree

  un atajo de sistema (KDE/GNOME) que ejecute el comando.'
