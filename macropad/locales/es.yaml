invalid_action_hint: 'El macropad solo envía teclas — no puede abrir programas ni ejecutar comandos.


  Para abrir un programa (ej.: kcalc):

  1. Asigne esta tecla como F13–F24 (pestaña Teclado → grupo Función) y envíela al macropad.

  2. En el escritorio: Preferencias del Sistema → Teclado → Atajos → Añadir nuevo → Comando o script…
  → escriba el comando.

  3. En el atajo creado, pulse la tecla física del macropad.'
