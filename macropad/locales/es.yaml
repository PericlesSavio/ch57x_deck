kb_hint: Haga clic en los modificadores (Ctrl, Shift…) y en una tecla para armar la combinación. El teclado
  muestra la distribución elegida en el menú Teclado; el macropad graba la posición física (HID) de la
  tecla — el carácter final depende de la distribución activa en el sistema operativo.
