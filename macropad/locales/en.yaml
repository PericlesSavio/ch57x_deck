invalid_action_hint: 'The macropad only sends keys — it cannot launch programs or run commands.


  To launch a program (e.g. kcalc):

  1. Map this key as F13–F24 (Keyboard tab → Function group) and send it to the macropad.

  2. In your desktop: System Settings → Keyboard → Shortcuts → Add new → Command or script… → type the
  command.

  3. In the new shortcut, press the physical macropad key.'
