adv_placeholder: 'e.g.: ctrl-alt-t  |  click(left)  |  <110>'
adv_hint: 'Free-form expression in the firmware dialect.

  Mouse: click(left), wheel(-1), move(5,0), drag(left,0,5)

  Raw code: <110>   Macro: ctrl-c,ctrl-v


  The macropad only sends keys — it does not run commands.

  To launch a program, map an F13–F24 key here and create a

  system shortcut (KDE/GNOME) that runs the command.'
