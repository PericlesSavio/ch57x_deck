about_title: About CH57x Deck
about_text: '<h3>CH57x Deck</h3><p>Version {version}</p><p>Created by <b>Péricles Sávio</b>.</p><p>Graphical
  frontend for <a href=''https://github.com/kriomant/ch57x-keyboard-tool'' style=''color:{link_color}''>ch57x-keyboard-tool</a>:
  builds the macropad configuration in a visual interface and delegates all USB communication (validation
  and writing to the device firmware) to that binary.</p><p>License: <b>GPL-3.0-or-later</b>.</p>'
