about_title: Sobre o CH57x Deck
about_text: '<h3>CH57x Deck</h3><p>Versão {version}</p><p>Criado por <b>Péricles Sávio</b>.</p><p>Frontend
  gráfico para o <a href=''https://github.com/kriomant/ch57x-keyboard-tool'' style=''color:{link_color}''>ch57x-keyboard-tool</a>:
  monta a configuração do macropad numa interface visual e delega a esse binário toda a comunicação USB
  (validação e gravação no firmware do dispositivo).</p><p>Licença: <b>GPL-3.0-or-later</b>.</p>'
