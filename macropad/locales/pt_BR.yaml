adv_hint: 'Expressão livre no dialeto do firmware.

  Mouse: click(left), wheel(-1), move(5,0), drag(left,0,5)

  Código bruto: <110>   Macro: ctrl-c,ctrl-v


  O macropad só envia teclas — ele não executa comandos.

  Para abrir um programa, mapeie uma tecla F13–F24 aqui e crie

  um atalho de sistema (KDE/GNOME) que rode o comando.'
