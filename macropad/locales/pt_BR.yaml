invalid_action_hint: 'O macropad só envia teclas — ele não abre programas nem executa comandos.


  Para abrir um programa (ex.: kcalc):

  1. Mapeie esta tecla como F13–F24 (aba Teclado → grupo Função) e envie ao macropad.

  2. No KDE: Configurações do Sistema → Teclado → Atalhos → Adicionar novo → Comando ou script… → digite
  o comando.

  3. No atalho criado, aperte a tecla física do macropad.'
