# CH57x Deck — traduções para o Português (Brasil).
#
# To add a language: copy en.yaml to <code>.yaml (e.g. fr.yaml, de.yaml),
# register the code in macropad/i18n.py (LANGUAGES) and translate only the
# VALUES to the right of the colons. Do NOT change the keys, the fields in
# braces ({version}, {n}…) or the HTML markup (<b>, <a href=…>).
# The '&' before a letter marks a menu accelerator (you may move it).

